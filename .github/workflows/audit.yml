name: Audit

on:
  push:
    branches: [main]
    paths: ["Formula/**", "Casks/**"]
  pull_request:
    paths: ["Formula/**", "Casks/**"]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tap this repo
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/layervai"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/layervai/homebrew-tap"

      - name: Audit formulae
        run: |
          for formula in Formula/*.rb; do
            [ -f "$formula" ] || continue
            name=$(basename "$formula" .rb)
            echo "::group::Auditing $name"
            brew audit --strict "layervai/tap/$name"
            echo "::endgroup::"
          done

      - name: Audit casks
        run: |
          # Casks here are generated by GoReleaser (qurl-integrations'
          # .goreleaser.yml), so audit without --strict: strict prose rules
          # would flag generated output nobody hand-authors.
          for cask in Casks/*.rb; do
            [ -f "$cask" ] || continue
            name=$(basename "$cask" .rb)
            echo "::group::Auditing cask $name"
            brew audit --cask "layervai/tap/$name"
            echo "::endgroup::"
          done

      - name: Style check
        run: |
          for file in Formula/*.rb Casks/*.rb; do
            [ -f "$file" ] || continue
            echo "::group::Style check $file"
            brew style "$file"
            echo "::endgroup::"
          done
