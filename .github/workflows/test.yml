name: Test

on:
  push:
    branches: [main]
    paths: ["Formula/**", "Casks/**"]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repo
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/layervai"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/layervai/homebrew-tap"

      - name: Install and test formulae
        run: |
          for formula in Formula/*.rb; do
            [ -f "$formula" ] || continue
            name=$(basename "$formula" .rb)
            echo "::group::Installing $name"
            brew install --build-from-source "layervai/tap/$name"
            echo "::endgroup::"
            echo "::group::Testing $name"
            brew test "layervai/tap/$name"
            echo "::endgroup::"
          done

      - name: Install casks
        run: |
          # Casks have no `brew test` block; installing and finding the
          # binary on PATH is the meaningful check. These are binary-artifact
          # casks, which install on macOS and Linux alike (Homebrew >= 4.5).
          # Token == binary name for everything GoReleaser publishes here.
          for cask in Casks/*.rb; do
            [ -f "$cask" ] || continue
            name=$(basename "$cask" .rb)
            echo "::group::Installing cask $name"
            brew install --cask "layervai/tap/$name"
            command -v "$name"
            echo "::endgroup::"
          done
